plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.abdurazaaqmohammed.packs.media'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.abdurazaaqmohammed.packs.media'
        // Screen capture is built on MediaProjection, which starts at API 21;
        // recording cannot work below it, so the pack no longer claims to.
        minSdk 21
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // The picker dialogs use java.util.function.Consumer (API 24).
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    compileOnly project(':sdk')
    compileOnly 'com.google.android.material:material:1.12.0'
    compileOnly 'androidx.appcompat:appcompat:1.7.0'
    compileOnly 'androidx.core:core:1.13.0'
}
