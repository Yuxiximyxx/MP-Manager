name: Release

# Publishing a release is a tag push: `git tag 1.2.0 && git push origin 1.2.0`.
# See docs/RELEASING.md for the one-time secret setup.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check tag against versionName
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)"/\1/p' app/build.gradle)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "::error::could not read versionName from app/build.gradle"
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle"
            exit 1
          fi
          echo "Releasing MP-Manager $version"

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured - see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Zipalign and sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?RELEASE_KEYSTORE_PASSWORD is not configured}"
          : "${KEY_ALIAS:?RELEASE_KEY_ALIAS is not configured}"
          : "${KEY_PASSWORD:?RELEASE_KEY_PASSWORD is not configured}"

          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          unsigned="$(find app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)"
          if [ -z "$unsigned" ]; then
            echo "::error::no unsigned release APK was produced"
            exit 1
          fi

          apk="MP-Manager-${GITHUB_REF_NAME#v}.apk"
          "${build_tools}/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "${build_tools}/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$apk" \
            "$RUNNER_TEMP/aligned.apk"
          "${build_tools}/apksigner" verify --print-certs "$apk"
          echo "$apk" > "$RUNNER_TEMP/apk-name.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(cat "$RUNNER_TEMP/apk-name.txt")"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
