name: Release

# Publishing a release is a tag push: `git tag 1.2.0 && git push origin 1.2.0`.
# Without the signing secrets the workflow still publishes an installable
# debug-signed APK and says so in the notes; see docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Patch incompatible Material attribute
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "android.R.attr.colorPrimaryContainer"
          new = "com.google.android.material.R.attr.colorPrimary"

          count = 0
          for path in Path(".").rglob("*.java"):
              source = path.read_text()
              updated = source.replace(old, new)
              if updated != source:
                  path.write_text(updated)
                  count += source.count(old)
                  print(f"Patched: {path}")

          print(f"Total replacements: {count}")
          PY

      - name: Resolve tag and version
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)"/\1/p' app/build.gradle)"
          if [ -z "$version" ]; then
            echo "::error::could not read versionName from app/build.gradle"
            exit 1
          fi
          if [ -n "$tag" ] && [ "${tag#v}" != "$version" ]; then
            echo "::error::tag ${tag} does not match versionName ${version} in app/build.gradle"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::notice::No release keystore configured - publishing a debug-signed APK. See docs/RELEASING.md."
          fi

      - name: Build release APK
        if: steps.signing.outputs.mode == 'release'
        run: ./gradlew --no-daemon --stacktrace assembleFullRelease

      - name: Build debug APK
        if: steps.signing.outputs.mode == 'debug'
        run: ./gradlew --no-daemon --stacktrace assembleFullDebug

      - name: Prepare signing key
        if: steps.signing.outputs.mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Zipalign and sign
        if: steps.signing.outputs.mode == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?RELEASE_KEYSTORE_PASSWORD is not configured}"
          : "${KEY_ALIAS:?RELEASE_KEY_ALIAS is not configured}"
          : "${KEY_PASSWORD:?RELEASE_KEY_PASSWORD is not configured}"

          build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          apk="$(find app/build/outputs/apk/full/release -name '*-unsigned.apk' -print -quit)"
          if [ -z "$apk" ]; then
            apk="$(find app/build/outputs/apk/full/release -name '*.apk' -print -quit)"
          fi
          if [ -z "$apk" ]; then
            echo "::error::no release APK was produced"
            exit 1
          fi

          "${build_tools}/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "${build_tools}/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$RUNNER_TEMP/signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "${build_tools}/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk"


      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            cp "$RUNNER_TEMP/signed.apk" "MP-Manager-$version.apk"
            echo "unsigned_note=false" >> "$GITHUB_OUTPUT"
          else
            src="$(find app/build/outputs/apk/full/debug -name '*.apk' -print -quit)"
            test -n "$src"
            cp "$src" "MP-Manager-$version-debug.apk"
            echo "unsigned_note=true" >> "$GITHUB_OUTPUT"
          fi
          ls -l MP-Manager-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_NOTE: ${{ steps.apk.outputs.unsigned_note }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          notes_file="$RUNNER_TEMP/notes.md"
          {
            if [ "$UNSIGNED_NOTE" = "true" ]; then
              echo "> **This build is debug-signed.** No release keystore is configured for this repository, so the APK is signed with the standard debug key. It installs and runs normally, but future builds signed with a real release key will not upgrade over it. Add the four signing secrets described in \`docs/RELEASING.md\` to switch to release signing."
              echo
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" --jq .body
          } > "$notes_file"

          gh release create "$tag" MP-Manager-*.apk \
            --title "MP Manager $VERSION" \
            --notes-file "$notes_file" \
            --verify-tag
