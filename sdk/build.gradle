plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.abdurazaaqmohammed.sdk'
    compileSdk 36

    defaultConfig {
        minSdk 19
        // Required by AGP whenever a module below API 21 turns on core library
        // desugaring; the host app is already multi-dex.
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // The packs call java.time (API 26+) and newer java.net codecs; the host
        // app already desugars, and the library declares the same so lint and
        // standalone consumers see a consistent contract.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
