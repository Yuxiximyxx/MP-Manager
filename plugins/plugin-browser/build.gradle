plugins {
    id 'com.android.application'
}

android {
    compileSdk 37
    namespace 'io.github.abdurazaaqmohammed.plugin.browser'
    defaultConfig {
        applicationId "io.github.abdurazaaqmohammed.plugin.browser"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Host contract constants only; never bundle the SDK into the plugin APK.
    compileOnly project(':sdk')
}
